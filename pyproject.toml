[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-aware-maintenance"
version = "0.2.0"
description = "Accessibility-aware maintenance allocation for a road-bridge-culvert network"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Accessibility-Aware Maintenance project" }]
keywords = ["roads", "bridges", "accessibility", "maintenance", "optimization"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "networkx>=3.2",
  "fastapi>=0.115",
  "pydantic>=2.6",
  # The real Alappuzha allocation instance reads its public layers from parquet, so the
  # base install (not just the geo extra) needs the dataframe/parquet stack.
  "pandas>=2.0",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
server = ["uvicorn>=0.30"]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyarrow>=15"]
sar = ["rasterio>=1.3", "shapely>=2.0"]

[project.scripts]
rra-demo = "rra.serve:main"
rra-api = "rra.api.serve:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
